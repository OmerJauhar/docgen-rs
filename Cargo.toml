[package]
name = "docgen-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
dotenv = "0.15.0"
git2 = "0.20.2"
ratatui = "0.29.0"
reqwest = { version = "0.12.22", features = ["json", "rustls-tls"] }
serde_json = "1.0.141"
similar = "2.7.0"
tokio = { version = "1.46.1", features = ["rt-multi-thread", "macros"] }
rfd = "0.13"
[profile.test]
debug = true
opt-level = 0 
