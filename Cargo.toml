[package]
name = "docgen"
version = "1.0.0"
edition = "2021"
authors = ["Omer Jauhar <omer.jauhar@greybeardsupport.com>"]
license = "MIT"
description = "AI-powered documentation generator for code changes - Internal tool for GreyBeard Outsourcing"
homepage = "https://greybeardsupport.com"
repository = "https://GreybeardTrilogy@dev.azure.com/GreybeardTrilogy/Document%20Generation/_git/Document%20Generation"
keywords = ["documentation", "ai", "git", "tui", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
exclude = ["tests/*", "docs/*", ".gitignore"]

[[bin]]
name = "docgen"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
crossterm = "0.29.0"
dirs = "5.0"
dotenv = "0.15.0"
git2 = "0.20.2"
ratatui = "0.29.0"
reqwest = { version = "0.12.22", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.141"
similar = "2.7.0"
tokio = { version = "1.46.1", features = ["rt-multi-thread", "macros"] }
rfd = "0.13"
[profile.test]
debug = true
opt-level = 0 
